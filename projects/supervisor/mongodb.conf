# 仅开发环境兜底：本地 MongoDB 实例（生产环境必须使用外部 MongoDB，本配置不参与生产部署）
# 注：当前容器环境 mongod 二进制不稳定（wiredtiger fassert），默认不自启；开发/测试默认使用平台远程 MongoDB
[program:mongodb]
command=sh -c "export $(grep -v '^#' /etc/environment | xargs) && /usr/bin/mongod --dbpath /workspace/projects/backend/data/mongodb --storageEngine ephemeralForTest --bind_ip 127.0.0.1 --port 27017"
directory=/workspace/projects/backend
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/workspace/logs/backend/mongodb.log
stderr_logfile=/workspace/logs/backend/mongodb.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
user=root
